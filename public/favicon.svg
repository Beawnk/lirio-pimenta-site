<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lírio Pimenta">
  <!-- Favicon da Lírio Pimenta, o mesmo desenho da demo: o monograma LP
       sobre o azul da fachada, com o traço vermelho embaixo.

       O logo completo não serve aqui — a 16px o escudo com "Lírio Pimenta"
       escrito vira um borrão.

       A fonte é Poppins com Arial de reserva. Na prática o navegador
       desenha em Arial: ele não baixa fonte da web para renderizar ícone
       de aba. Para sair em Poppins de verdade, as letras teriam que virar
       vetor. -->
  <rect width="100" height="100" rx="22" fill="#0f5c8c" />
  <text
    x="50"
    y="58"
    font-size="46"
    font-family="Poppins,Arial,sans-serif"
    font-weight="800"
    fill="#f5c542"
    text-anchor="middle"
  >LP</text>
  <path d="M30 74 h40" fill="none" stroke="#e63946" stroke-width="5" stroke-linecap="round" />
</svg>
